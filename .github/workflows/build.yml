name: Build & Release Windows EXE (Go Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Build Executable (Pure Go Cross-Compile)
      run: |
        mkdir -p Release_Package/media
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o Release_Package/SmartOfficeAnnouncer.exe .

    - name: Prepare Release Package
      run: |
        cp config.json Release_Package/ 2>/dev/null || true
        if [ -d "media" ]; then
          cp -r media/* Release_Package/media/ 2>/dev/null || true
        fi
        
        # Zip the package for release download
        cd Release_Package && zip -r ../SmartOfficeAnnouncer_Windows_Ready.zip . && cd ..

    - name: Upload Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: SmartOfficeAnnouncer_Windows_Ready
        path: Release_Package/

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.3
        name: "Smart Office Announcer v2.0.3 (Fix System Tray & App Window)"
        body: |
          ### 📢 Smart Office Announcement & Prayer Alert System v2.0.3

          **Aplikasi Desktop Mandiri (.EXE) untuk Windows 10 / 11**

          #### 🔧 Perbaikan Kritis v2.0.3:
          - 🐛 **Fix System Tray Tidak Muncul**: Perbaikan arsitektur threading — `systray` sekarang berjalan di main thread sesuai requirement Win32 API. Ini adalah root cause mengapa app tidak terlihat setelah dijalankan.
          - 🪟 **Fix App Window Tidak Terbuka**: Startup flow diperbaiki, window app kini muncul otomatis setelah ±500ms.
          - 🔌 **Fix Shutdown**: Tombol "Keluar" di system tray kini benar-benar menutup seluruh proses.
          - 🛡️ **Graceful Shutdown**: Signal OS (Ctrl+C) dan tray quit keduanya menghentikan server & scheduler dengan aman.

          #### ✨ Fitur Lengkap:
          - ✅ **System Tray**: Ikon di pojok kanan bawah taskbar. Klik untuk buka dashboard atau keluar.
          - ✅ **Native App Window**: Dashboard terbuka sebagai window mandiri (tanpa tab/address bar browser).
          - ✅ **Zero-Dependency**: Pure Go, tidak membutuhkan Python runtime.
          - ✅ **Ultra-Ringan**: ~25-35 MB RAM, CPU 0% saat idle.
          - ✅ **Anti-Mati**: Menutup jendela (tombol X) tidak mematikan jadwal — tetap berjalan di system tray.
          - ✅ **Log Otomatis**: Log tersimpan di `logs/announcer.log` untuk memudahkan diagnosa.
          - ✅ **Auto-Start Windows**: Bisa dikonfigurasi untuk auto-start saat Windows menyala.

          #### 📥 Cara Menggunakan:
          1. Unduh file `SmartOfficeAnnouncer_Windows_Ready.zip` di bawah ini.
          2. Ekstrak file zip ke folder pilihan (misal: `C:\SmartOfficeAnnouncer`).
          3. Jalankan `SmartOfficeAnnouncer.exe`.
          4. Ikon akan muncul di **system tray** (pojok kanan bawah taskbar).
          5. Jendela aplikasi desktop terbuka otomatis dalam ±1 detik.
        files: SmartOfficeAnnouncer_Windows_Ready.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
