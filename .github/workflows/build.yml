name: Build & Release Windows EXE (Go Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Build Executable (Pure Go Cross-Compile)
      run: |
        mkdir -p Release_Package/media
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -H=windowsgui" -o Release_Package/SmartOfficeAnnouncer.exe .

    - name: Prepare Release Package
      run: |
        cp config.json Release_Package/ 2>/dev/null || true
        if [ -d "media" ]; then
          cp -r media/* Release_Package/media/ 2>/dev/null || true
        fi
        
        # Zip the package for release download
        cd Release_Package && zip -r ../SmartOfficeAnnouncer_Windows_Ready.zip . && cd ..

    - name: Upload Artifact (Actions Tab)
      uses: actions/upload-artifact@v4
      with:
        name: SmartOfficeAnnouncer_Windows_Ready
        path: Release_Package/

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.1
        name: "Smart Office Announcer v2.0.1 (Native App Window - Go Engine)"
        body: |
          ### 📢 Smart Office Announcement & Prayer Alert System v2.0.1
          
          **Aplikasi Desktop Mandiri (.EXE) untuk Windows 10 / 11**
          - ✨ **Native App Window**: Langsung terbuka sebagai jendela aplikasi Windows tersendiri (tanpa tab atau address bar browser).
          - ⚡ **Zero-Dependency**: Pure Go, tidak membutuhkan instalasi Python runtime.
          - 🪶 **Ultra-Ringan**: Sangat hemat RAM (~25-35 MB) dan CPU 0% saat idle, optimal untuk PC spek kantor/kentang.
          - 🛡️ **Anti-Mati**: Jika jendela aplikasi ditutup oleh user via tombol `X`, jadwal pengumuman & adzan tetap aktif berbunyi di latar belakang (System Tray).
          - 🎵 Sudah termasuk starter audio pengumuman & adzan di folder `media/`.
          
          #### 📥 Cara Menggunakan:
          1. Unduh file `SmartOfficeAnnouncer_Windows_Ready.zip` di bawah ini.
          2. Ekstrak file zip ke folder pilihan di PC kantor (misal: `C:\SmartOfficeAnnouncer`).
          3. Jalankan `SmartOfficeAnnouncer.exe`.
          4. Jendela aplikasi desktop akan langsung terbuka otomatis.
        files: SmartOfficeAnnouncer_Windows_Ready.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
